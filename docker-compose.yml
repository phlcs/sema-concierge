# ─────────────────────────────────────────────────────────────────────────────
# USO EXCLUSIVO EM DESENVOLVIMENTO LOCAL
# Em produção (Railway), Postgres e Redis são plugins da plataforma,
# não containers gerenciados por este arquivo.
# Comando: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contador
      POSTGRES_PASSWORD: contador_dev
      POSTGRES_DB: pergunteaosecontador
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contador -d pergunteaosecontador"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
